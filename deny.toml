# cargo-deny: licences, bans and sources (architecture §13). The advisories
# check runs only in CI (tools/lint.sh), because it downloads the database.

[graph]
all-features = true

[advisories]
version = 2
# zbus 5's parts, merged into zbus 6 and so marked unmaintained. ksni
# 0.3.7, the latest, needs zbus 5; the owner chose to keep it
# (2026-11-14, plan 004). Lift with the pin when ksni moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: zbus 5, held for ksni (plan 004)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: zbus 5, held for ksni (plan 004)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: zbus 5, held for ksni (plan 004)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# target-lexicon reaches the build through system-deps (GTK's -sys crates
# find their libraries with it). It runs at build time only and is not in
# the binaries; the LLVM exception only widens Apache-2.0.
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# The tray (plan 004): a public-domain dedication, compatible with MIT,
# allowed for ksni only (owner, 2026-11-13).
[[licenses.exceptions]]
crate = "ksni"
allow = ["Unlicense"]

[licenses.private]
# The workspace's own crates are not published; their licence is LICENSE.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Two D-Bus stacks in one daemon: zbus stays on one version (architecture §5.6).
deny = [{ name = "zbus", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
