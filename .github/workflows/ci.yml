# mirqab CI: the four gates CLAUDE.md asks for before every commit and push,
# as the four required checks of the protected main (architecture §16.1).
#   lint    tools/lint.sh (fmt, clippy, cargo deny with advisories, the
#           headless-crate rule, shellcheck, jq, the grep rules, coverage)
#   test    on a pull request tests/run.sh --affected: only the tests its
#           changes affect; on a push to main the full tests/run.sh
#   docs    tools/check-docs.sh
#   secrets tools/secrets.sh: gitleaks over every commit plus the privacy
#           patterns (needs full history)
# Every job runs in an Arch container, the distribution mirqab targets, and
# runs its gate as an unprivileged user, ci, who owns the checkout (so git
# needs no safe.directory exception). Actions are pinned by SHA.
#
# Adapted from haseen .github/workflows/ci.yml (MIT, (c) 2026 t1nk33r;
# NOTICE.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. A run on main is
  # never cancelled, because it is the full suite behind affected-only PRs:
  # each push to main gets a group of its own commit, since a group keeps
  # one pending run and a newer queued one cancels it whatever
  # cancel-in-progress says (plan 024 L22).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ARCH_PACKAGES: >-
    base-devel rust pkgconf gtk4 libadwaita gtk4-layer-shell sqlite dbus
    shellcheck jq git systemd cargo-deny gitleaks desktop-file-utils socat
  CARGO_TERM_COLOR: never

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          read -ra pkgs <<<"$ARCH_PACKAGES"
          pacman -Syu --noconfirm --needed "${pkgs[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unprivileged user
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
      - name: Versions
        run: |
          rustc --version; cargo clippy --version; cargo fmt --version
          cargo-deny --version; shellcheck --version | sed -n 2p
      - name: tools/lint.sh
        # The cargo cache action restores ~/.cargo and target/ as root; hand
        # both to ci, which runs the gate.
        run: |
          mkdir -p "$HOME/.cargo"
          chown -R ci:ci "$HOME/.cargo" "$GITHUB_WORKSPACE"
          runuser -u ci -- env CI=1 HOME=/home/ci CARGO_HOME="$HOME/.cargo" tools/lint.sh

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Tools
        run: |
          read -ra pkgs <<<"$ARCH_PACKAGES"
          # zsh and fish: tests/test-cli.sh parses their completion scripts.
          # python-gobject: tests/test-ui-apps.sh builds a D-Bus CommandLine
          # call with GLib to prove --do is refused without MIRQAB_TEST.
          # qt6-declarative: /usr/lib/qt6/bin/qmllint, which tests/test-contrib.sh
          # runs on contrib/haseen's Widget.qml (it fails without it here).
          pacman -Syu --noconfirm --needed "${pkgs[@]}" zsh fish python-gobject qt6-declarative
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge base must be in the clone.
          fetch-depth: 0
      - name: Unprivileged user
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - name: tests/run.sh
        # A pull request runs the tests its changes affect, measured from the
        # event's base commit to the checked-out head; a push to main and a
        # manual run run the full suite. An empty selection passes, so the
        # required check reports on a docs-only pull request too.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$HOME/.cargo"
          chown -R ci:ci "$HOME/.cargo" "$GITHUB_WORKSPACE"
          args=()
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              args=(--affected --committed "$BASE_SHA")
          fi
          runuser -u ci -- env CI=1 HOME=/home/ci CARGO_HOME="$HOME/.cargo" tests/run.sh "${args[@]}"
      - name: tools/bench-idle.sh
        # The daemon's budget (architecture §9.1): idle, idle with the tray
        # registered (fails, not skips, without dbus-daemon), with a live
        # subscription, and the apps walk at 400 processes (plan 006, part
        # 4), best of three 60 s runs on this noisy shared runner. On a
        # pull request only when it touches what the benchmark builds or
        # reads: the crates, the workspace's manifest, lock file and
        # toolchain, the benchmark and the fixture it runs on.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              # Its own statement, so a git error fails the step instead of
              # skipping the gate. As ci, who owns the checkout: git refuses
              # a repository owned by another user (dubious ownership).
              inputs=(crates/ Cargo.toml Cargo.lock rust-toolchain.toml
                  tools/bench-idle.sh tools/mkfixture.sh
                  tests/fixtures/root-desktop/ tests/fixtures/procs.tsv)
              changed="$(runuser -u ci -- git diff --name-only "$BASE_SHA" HEAD -- "${inputs[@]}")"
              if [[ -z $changed ]]; then
                  echo "no change to the benchmark's inputs: skipped"
                  exit 0
              fi
          fi
          bench() { runuser -u ci -- env HOME=/home/ci CARGO_HOME="$HOME/.cargo" tools/bench-idle.sh --runs 3 "$@"; }
          bench
          bench --tray
          bench --subscribe system --live
          bench --subscribe apps --max-cpu 1.5 --procs 400

  docs:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git gawk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Unprivileged user
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: tools/check-docs.sh
        run: runuser -u ci -- env CI=1 HOME=/home/ci tools/check-docs.sh

  secrets:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git gitleaks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Unprivileged user
        # The whole clone, every object of the full history included.
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: tools/secrets.sh
        run: runuser -u ci -- env CI=1 HOME=/home/ci tools/secrets.sh
